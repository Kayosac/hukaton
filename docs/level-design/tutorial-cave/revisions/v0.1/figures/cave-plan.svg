00" r="20" fill="#303b37" stroke="none" stroke-width="2"/><text x="1320.0" y="236.0" font-size="23" font-weight="500" text-anchor="middle" fill="#faf6e9">1</text><text x="1352.0" y="235.0" font-size="24" font-weight="500" text-anchor="start" fill="#303b37">Пробуждение</text><text x="1310.0" y="268.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Тесно, сухо, безопасно.</text><text x="1310.0" y="292.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Три инструкции уже в руке.</text><text x="1310.0" y="316.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Два броска → R.</text><circle cx="1320.00" cy="352.00" r="20" fill="#303b37" stroke="none" stroke-width="2"/><text x="1320.0" y="360.0" font-size="23" font-weight="500" text-anchor="middle" fill="#faf6e9">2</text><text x="1352.0" y="359.0" font-size="24" font-weight="500" text-anchor="start" fill="#303b37">Корневой затвор</text><text x="1310.0" y="392.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Первый понятный барьер.</text><text x="1310.0" y="416.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Огонь открывает проход.</text><text x="1310.0" y="440.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">За корнями меняется масштаб.</text><circle cx="1320.00" cy="476.00" r="20" fill="#303b37" stroke="none" stroke-width="2"/><text x="1320.0" y="484.0" font-size="23" font-weight="500" text-anchor="middle" fill="#faf6e9">3</text><text x="1352.0" y="483.0" font-size="24" font-weight="500" text-anchor="start" fill="#303b37">Уступ над водой</text><text x="1310.0" y="516.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Высокий зал раскрывается сразу.</text><text x="1310.0" y="540.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Дальше видно светлый берег.</text><text x="1310.0" y="564.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Спуск без обязательного прыжка.</text><circle cx="1320.00" cy="600.00" r="20" fill="#303b37" stroke="none" stroke-width="2"/><text x="1320.0" y="608.0" font-size="23" font-weight="500" text-anchor="middle" fill="#faf6e9">4</text><text x="1352.0" y="607.0" font-size="24" font-weight="500" text-anchor="start" fill="#303b37">Ледяная переправа</text><text x="1310.0" y="640.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Лёд выдаётся на сухом берегу.</text><text x="1310.0" y="664.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Один бросок → весь участок замёрз.</text><text x="1310.0" y="688.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Падение → ближайший берег A/B.</text><circle cx="1320.00" cy="724.00" r="20" fill="#303b37" stroke="none" stroke-width="2"/><text x="1320.0" y="732.0" font-size="23" font-weight="500" text-anchor="middle" fill="#faf6e9">5</text><text x="1352.0" y="731.0" font-size="24" font-weight="500" text-anchor="start" fill="#303b37">Ход с эхом</text><text x="1310.0" y="764.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Поворот прячет финальный грот.</text><text x="1310.0" y="788.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Короткая ниша для любопытства.</text><text x="1310.0" y="812.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Шуршание направляет к кусту.</text><circle cx="1320.00" cy="848.00" r="20" fill="#303b37" stroke="none" stroke-width="2"/><text x="1320.0" y="856.0" font-size="23" font-weight="500" text-anchor="middle" fill="#faf6e9">6</text><text x="1352.0" y="855.0" font-size="24" font-weight="500" text-anchor="start" fill="#303b37">Непрошеный партнёр</text><text x="1310.0" y="888.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">Удар по кусту → гоблин.</text><text x="1310.0" y="912.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">≈5 с беготни → семь реплик.</text><text x="1310.0" y="936.0" font-size="20" font-weight="400" text-anchor="start" fill="#627069">E → затемнение → лавка.</text><line x1="65.00" y1="1025.00" x2="1735.00" y2="1025.00" stroke="#b8bbab" stroke-width="2"/><line x1="70.00" y1="1062.00" x2="115.00" y2="1062.00" stroke="#a5623b" stroke-width="4" stroke-dasharray="8 5"/><text x="130.0" y="1069.0" font-size="20" font-weight="400" text-anchor="start" fill="#303b37">путь</text><circle cx="260.00" cy="1062.00" r="14" fill="none" stroke="#3b7587" stroke-width="1.5" stroke-dasharray="4 3"/><text x="285.0" y="1069.0" font-size="20" font-weight="400" text-anchor="start" fill="#303b37">зона выдачи карты · R 3,5 м</text><text x="710.0" y="1069.0" font-size="20" font-weight="400" text-anchor="start" fill="#303b37">О / Л / У — Огонь / Лёд / Удар</text><text x="1735.0" y="1069.0" font-size="19" font-weight="400" text-anchor="end" fill="#627069">Размеры стартовые · Unity-плейтест впереди</text></g></svg>