<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13z" fill="#2d2836"/></marker><marker id="arrw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#ffffff"/></marker><marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M0 0 L18 9 L0 18z" fill="#2f7fb5"/></marker><pattern id="cloud" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#fbfaf7"/><circle cx="4" cy="5" r="1.1" fill="#ddd7e4"/><circle cx="13" cy="13" r="1.1" fill="#ddd7e4"/></pattern><pattern id="roof" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#3a3244" stroke-width="2.2" stroke-opacity=".55"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#4a4155" stroke-width="1.2" stroke-opacity=".5"/></pattern></defs><rect width="1700" height="1200" fill="#f2eef4"/><text x="50.0" y="50.0" font-size="30" fill="#2d2836" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >Горы бога · финал: край, ладонь, подъём к лицу · разрез с юга на север</text><text x="50.0" y="82.0" font-size="15" fill="#5a5266" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Слева — в масштабе (сетка 5 м). Справа — бог условно: положение и масштаб задаются после сборки сцены. Номера F0–F8 — порядок шагов.</text><rect x="0" y="790.0" width="1700" height="410.0" fill="url(#cloud)"/><rect x="0" y="760.0" width="1700" height="30" fill="#d6d0e8"/><text x="70.0" y="824.0" font-size="14" fill="#6a6280" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >облачное море далеко внизу (глубина обрыва — после сборки сцены)</text><line x1="84.3" y1="106.0" x2="84.3" y2="754.0" stroke="#e2dbe7"/><text x="84.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 15</text><line x1="129.3" y1="106.0" x2="129.3" y2="754.0" stroke="#e2dbe7"/><text x="129.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 20</text><line x1="174.3" y1="106.0" x2="174.3" y2="754.0" stroke="#e2dbe7"/><text x="174.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 25</text><line x1="219.3" y1="106.0" x2="219.3" y2="754.0" stroke="#e2dbe7"/><text x="219.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 30</text><line x1="264.3" y1="106.0" x2="264.3" y2="754.0" stroke="#e2dbe7"/><text x="264.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 35</text><line x1="309.3" y1="106.0" x2="309.3" y2="754.0" stroke="#e2dbe7"/><text x="309.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 40</text><line x1="354.3" y1="106.0" x2="354.3" y2="754.0" stroke="#e2dbe7"/><text x="354.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 45</text><line x1="399.3" y1="106.0" x2="399.3" y2="754.0" stroke="#e2dbe7"/><text x="399.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 50</text><line x1="444.3" y1="106.0" x2="444.3" y2="754.0" stroke="#e2dbe7"/><text x="444.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 55</text><line x1="489.3" y1="106.0" x2="489.3" y2="754.0" stroke="#e2dbe7"/><text x="489.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 60</text><line x1="534.3" y1="106.0" x2="534.3" y2="754.0" stroke="#e2dbe7"/><text x="534.3" y="772.0" font-size="10" fill="#8a8296" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >y 65</text><polygon points="78.0,754.0 124.8,526.3 158.1,437.2 184.2,364.3 188.7,238.3 210.3,121.3 273.3,107.8 327.3,184.3 367.8,265.3 384.0,278.8 384.0,340.0 510.0,335.5 511.8,394.0 492.0,484.0 505.5,610.0 483.0,754.0" fill="#6c6178" stroke="#4a4155" stroke-width="2" /><polyline points="184.2,364.3 235.5,358.0 280.5,351.7 330.0,345.4 348.0,342.7 384.0,340.0" fill="none" stroke="#3f8a62" stroke-width="5" stroke-dasharray="10 6"/><text x="201.3" y="170.8" font-size="12" fill="#e8f4ec" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >Z6 Горло</text><text x="201.3" y="188.8" font-size="12" fill="#e8f4ec" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >сквозь хребет:</text><text x="201.3" y="206.8" font-size="12" fill="#e8f4ec" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >наружу не видно</text><text x="201.3" y="224.8" font-size="12" fill="#e8f4ec" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >до устья M</text><polyline points="163.5,437.2 184.2,364.3" fill="none" stroke="#b88a12" stroke-width="5" /><text x="66.3" y="418.3" font-size="13" fill="#7a5c06" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >Z5 полка</text><polyline points="384.0,340.0 510.0,335.5" fill="none" stroke="#2f7fb5" stroke-width="6" /><line x1="384.0" y1="340.0" x2="384.0" y2="323.8" stroke="#2d2836" stroke-width="3"/><circle cx="384.0" cy="325.6" r="4" fill="#2d2836"/><text x="384.0" y="362.0" font-size="15" fill="#1d5a85" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >M</text><line x1="487.5" y1="336.4" x2="487.5" y2="320.2" stroke="#2d2836" stroke-width="3"/><circle cx="487.5" cy="322.0" r="4" fill="#2d2836"/><text x="487.5" y="358.4" font-size="15" fill="#d1343b" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >E</text><line x1="487.5" y1="276.4" x2="487.5" y2="344.4" stroke="#d1343b" stroke-width="2.5" stroke-dasharray="6 4"/><text x="506.0" y="375.5" font-size="13" fill="#2d2836" text-anchor="end" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >кромка</text><polygon points="511.8,335.5 582.0,338.2 690.0,344.5 762.0,362.5 780.0,394.0 708.0,398.5 582.0,385.0 513.6,350.8" fill="#6f86c9" stroke="#3c4f8a" stroke-width="2" fill-opacity=".9"/><text x="573.0" y="419.2" font-size="13" fill="#3c4f8a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >ладонь A02 у кромки (F2–F3)</text><text x="573.0" y="440.8" font-size="12" fill="#3c4f8a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >зазор ≤ 0,3 м по высоте, ≤ 0,5 м вперёд</text><circle cx="515.4" cy="323.5" r="8" fill="#fff" stroke="#2f7fb5" stroke-width="3"/><text x="515.4" y="327.5" font-size="11" fill="#1d5a85" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >D</text><line x1="1235" y1="120" x2="1235" y2="790.0" stroke="#8a8296" stroke-width="2" stroke-dasharray="8 8"/><path d="M1225 420 L1245 440 L1225 460 L1245 480" fill="#f2eef4" stroke="#8a8296" stroke-width="2"/><text x="1249.0" y="114.0" font-size="13" fill="#6a6276" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >разрыв: расстояние до бога не в масштабе</text><g fill="#5f74c2" stroke="#34478a" stroke-width="2"><path d="M1390 790.0 C1420 600 1400 420 1440 300 L1490 300 C1530 420 1510 600 1540 790.0 Z"/><ellipse cx="1465" cy="250" rx="46" ry="62"/><path d="M1414 205 L1516 205 L1470 110 Z" fill="#6b3f86"/><path d="M1440 360 C1340 330 1270 300 1230 330" fill="none" stroke-width="24" stroke="#5f74c2"/></g><text x="1465.0" y="830.0" font-size="15" fill="#34478a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >MG01 условно</text><text x="1465.0" y="850.0" font-size="13" fill="#34478a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >не в масштабе</text><circle cx="1340" cy="250" r="10" fill="#fff" stroke="#2f7fb5" stroke-width="3"/><text x="1340.0" y="254.0" font-size="11" fill="#1d5a85" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >H</text><text x="1324.0" y="232.0" font-size="13" fill="#1d5a85" text-anchor="end" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >точка разговора перед лицом</text><path d="M1225 335 C1040 420 1275 500 765.4 340.5" fill="none" stroke="#3c4f8a" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/><text x="1130.0" y="440.0" font-size="14" fill="#3c4f8a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F2 рука опускается к кромке</text><path d="M635.4 295.5 C815.4 115.5 1080 370 1326 256" fill="none" stroke="#2f7fb5" stroke-width="4" marker-end="url(#arrb)"/><text x="765.4" y="105.5" font-size="14" fill="#1d5a85" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F5 подъём на ладони, 15–20 с</text><text x="765.4" y="124.5" font-size="12" fill="#1d5a85" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >взгляд свободен, ходьба закрыта</text><line x1="384.0" y1="325.6" x2="1420" y2="270" stroke="#2f7fb5" stroke-width="1.5" stroke-dasharray="4 5"/><text x="544.0" y="215.6" font-size="13" fill="#1d5a85" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F0 первый взгляд с устья M</text><rect x="50" y="870.0" width="1030" height="273" fill="#ffffff" stroke="#d8d1de" rx="6"/><text x="70.0" y="900.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F0</text><text x="118.0" y="900.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Выход из горла в M: свободное управление, вид на бога, пауза</text><text x="70.0" y="927.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F1</text><text x="118.0" y="927.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Пересёк E (2,5 м до кромки): ходьба и мышь закрыты, взгляд ведётся к богу</text><text x="70.0" y="954.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F2</text><text x="118.0" y="954.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Бог опускает поднятую ладонь A02, кончики пальцев встают в D, 8–12 с</text><text x="70.0" y="981.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F3</text><text x="118.0" y="981.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Взгляд и ходьба возвращены (без прыжка): игрок сам шагает на ладонь</text><text x="70.0" y="1008.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F4</text><text x="118.0" y="1008.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Стоит на ладони ≥ 0,5 с и дальше 2 м от кромки: ходьба закрыта</text><text x="70.0" y="1035.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F5</text><text x="118.0" y="1035.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Подъём к лицу; в конце взгляд ведётся к глазам</text><text x="70.0" y="1062.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F6</text><text x="118.0" y="1062.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Разговор: реплики бога, каждая — по E</text><text x="70.0" y="1089.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F7</text><text x="118.0" y="1089.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Последняя реплика: в руке «Пора домой»; ЛКМ — бросок</text><text x="70.0" y="1116.0" font-size="15" fill="#2f7fb5" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" >F8</text><text x="118.0" y="1116.0" font-size="15" fill="#2d2836" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif" >Обычный возврат: вспышка, затемнение, лавка</text></svg>